<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giữa kì I – Tiếng Việt 4 – Đề 9: Lời cổ vũ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,500;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --main:#6b4fc4; --dark:#47318f; --soft:#ece7fb; --bg1:#e6e0f8; --bg2:#f6f3fd;
  --sun:#ffb53d; --ink:#27323f; --paper:#fffdf8; --line:#dde3ea; --mute:#5d6b7a;
  --ok:#1f9d63; --ok-bg:#e2f7eb; --bad:#d94b4b; --bad-bg:#fdeaea;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito',system-ui,Arial,sans-serif;color:var(--ink);font-size:17px;line-height:1.6;background:linear-gradient(180deg,var(--bg1) 0,var(--bg2) 520px,var(--bg2) 100%);}
h1,h2,h3{font-family:'Baloo 2','Nunito',system-ui,sans-serif;line-height:1.2;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 80px}
.hero{position:relative;margin:0 -14px;overflow:hidden}
.hero svg{display:block;width:100%;height:auto}
.hero-title{position:absolute;left:0;right:0;top:4%;text-align:center;padding:0 12px}
.hero-title .wk{display:inline-block;background:#fff;color:var(--dark);font-weight:800;border-radius:999px;padding:3px 16px;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.hero-title h1{font-size:clamp(26px,8.5vw,56px);color:#fff;font-weight:800;text-shadow:0 3px 0 var(--dark),0 6px 14px rgba(0,0,0,.3);margin-top:4px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:20px 18px;margin-top:18px;box-shadow:0 6px 0 rgba(0,0,0,.07);position:relative}
.info{display:grid;grid-template-columns:1fr 130px;gap:12px}
.info label{font-weight:800;font-size:15px;display:block;margin-bottom:4px}
.info input,.info select{width:100%;font:inherit;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.info select{min-height:52px;font-weight:700}
.info input[readonly]{background:#eef2f6;font-weight:800}
#otherWrap{margin-top:8px;display:none}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.prog{position:sticky;top:0;z-index:20;margin:10px -14px 0;padding:8px 14px 6px;background:linear-gradient(180deg,var(--bg1) 70%,rgba(255,255,255,0))}
.prog .bar{height:12px;border-radius:99px;background:#fff;border:2px solid var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--main),var(--sun));transition:width .35s}
.prog small{display:block;font-weight:800;color:var(--dark);font-size:13.5px;margin-top:2px}
#snd{position:fixed;right:10px;top:10px;z-index:30;width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);color:#fff;font-size:21px;cursor:pointer;display:grid;place-items:center;padding:0}
.section-h{display:flex;align-items:center;gap:12px;margin:34px 0 0}
.section-h .ico{flex:none;width:54px;height:54px}
.section-h h2{font-size:27px;color:var(--dark)}
.section-h p{margin:0;font-size:15px;color:var(--mute)}
.passage{background:#fff;border-left:6px solid var(--sun);border-radius:14px;padding:14px 18px}
.passage h3{text-align:center;color:var(--dark);font-size:24px;margin-bottom:8px;letter-spacing:.5px}
.passage p{margin:0 0 8px}
.passage .src{text-align:right;font-style:italic;font-weight:700;color:var(--mute);margin:6px 0 0}
.mini{background:#fff;border-left:6px solid var(--sun);border-radius:12px;padding:10px 14px;margin:6px 0 10px}
.q-head{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:baseline;margin-bottom:10px}
.qlab{flex:none;background:var(--main);color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;border-radius:999px;padding:0 14px;box-shadow:0 3px 0 var(--dark)}
.qlab.sm{font-size:15px;padding:0 11px}
.q-head .t{font-weight:800;font-size:18px;flex:1 1 220px;min-width:0}
.pts{font-size:13.5px;font-weight:800;color:var(--mute)}
.part{margin-top:12px;position:relative}
.part+.part{padding-top:12px;border-top:2px dashed var(--line)}
.pq{font-weight:800;margin:0 0 8px}
.hint{font-size:15px;color:var(--mute);margin:-2px 0 10px}
.opts{display:grid;gap:9px}
.opts.inline{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;background:#fff;width:100%;min-height:50px}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--dark);display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-size:16px;margin-top:1px}
.opt span{flex:1;min-width:0}
.opt:active{transform:scale(.99)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong b{background:var(--bad);color:#fff}
.locked .opt{cursor:default}
.ff{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:9px;padding:8px 12px;border:2px solid var(--line);border-radius:14px;background:#fff}
.ff>span.lb{font-weight:800;flex:none}
.ff input{flex:1 1 150px;min-width:0;font:inherit;font-weight:700;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.ff.right{border-color:var(--ok);background:var(--ok-bg)}
.ff.wrong{border-color:var(--bad);background:var(--bad-bg)}
.ff .fix{display:none;flex-basis:100%;font-weight:800;color:var(--ok);font-size:14.5px}
.ff.wrong .fix{display:block}
textarea{width:100%;min-height:110px;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);resize:vertical}
textarea.tall{min-height:260px}
.note{font-size:14.5px;color:var(--mute);margin:8px 0 0}
.sugg{display:none;margin-top:12px;background:#fff6dd;border:2px dashed var(--sun);border-radius:14px;padding:12px 14px}
.graded .sugg{display:block}
.btn{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:22px;border:0;border-radius:999px;padding:12px 38px;cursor:pointer;background:var(--sun);color:#5a3a00;box-shadow:0 6px 0 #d18a12}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #d18a12}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{font-size:17px;padding:8px 24px;margin-top:10px;box-shadow:0 4px 0 #d18a12}
.btn.green{background:var(--main);color:#fff;box-shadow:0 6px 0 var(--dark);font-size:18px;padding:9px 28px}
.fb{display:none;margin-top:10px;border-radius:14px;padding:10px 14px;font-weight:700}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);border:2px solid var(--ok)}
.fb.no{background:var(--bad-bg);border:2px solid var(--bad)}
.fb .h{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:800}
.fb.ok .h{color:#12724a}.fb.no .h{color:#a73232}
.fb p{margin:2px 0 0;font-weight:700}
.fb p.why{font-weight:600;color:var(--mute)}
.stars{position:absolute;inset:0;pointer-events:none;overflow:visible}
.stars i{position:absolute;font-style:normal;font-size:20px;left:50%;top:40%;animation:burst .9s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
.submit-zone{text-align:center;margin-top:30px}
#msg{color:var(--bad);font-weight:800;min-height:26px;margin:10px 0 0}
#result{display:none;text-align:center;background:linear-gradient(180deg,#fff8e1,#fffdf6);border-color:var(--sun)}
#result.show{display:block}
#result .em{font-size:60px;line-height:1}
#result .sc{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:46px;color:var(--dark);line-height:1.1}
#result .s10{font-weight:800;color:#b36b00}
#result table{margin:12px auto;border-collapse:collapse;font-size:15.5px}
#result td{padding:4px 12px;border-bottom:1px dashed var(--line);text-align:left}
#result td:last-child{text-align:right;font-weight:800}
#sendInfo{font-weight:800;margin:6px 0 10px}
.score-tag{display:none;float:right;font-weight:800;font-size:13.5px;border-radius:999px;padding:1px 12px;color:#fff;margin-left:8px}
.score-tag.show{display:inline-block}
.score-tag.full{background:var(--ok)}.score-tag.part{background:#e59a1c}.score-tag.zero{background:var(--bad)}
@media (max-width:600px){
  body{font-size:16px}
  .info{grid-template-columns:1fr}
  .opts.inline{grid-template-columns:1fr}
}
.cloud{animation:drift 30s linear infinite alternate}
@keyframes drift{to{transform:translateX(40px)}}
.wave{animation:wv 6s ease-in-out infinite alternate}
@keyframes wv{to{transform:translateX(-26px)}}
.fly{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translate(8px,-10px) rotate(4deg)}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(3deg)}}
.rise{animation:rise 5s ease-in infinite;transform-box:fill-box}
@keyframes rise{0%{transform:translateY(24px);opacity:0}20%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
.flick{animation:flick 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.08,.92)}}
.flagw{animation:fw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}
@keyframes fw{50%{transform:skewY(-5deg) scaleX(.95)}}
.spot{animation:sp 4s ease-in-out infinite}
@keyframes sp{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.cloud,.wave,.fly,.twinkle,.sway,.rise,.flick,.flagw,.spot{animation:none}.stars{display:none}html{scroll-behavior:auto}.prog .bar i{transition:none}}
</style>
</head>

<div class="wrap">

<div class="card info">
  <div><label for="studentName">Họ và tên của em</label>

<script>
(function(){
"use strict";
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxcmRHrOmXUrow5v79Xe0Eagd_rfxD8nxGqnTwjnieRWuLZBpgVORHnRJ3ec_4WQ7nI/exec';

function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function fmt(n){return (Math.round(n*100)/100).toString().replace('.',',');}
function norm(s){return String(s||'').normalize('NFC').toLocaleLowerCase('vi').replace(/[\s ]+/g,' ').replace(/^[\s"“”'.,;:!?]+|[\s"“”'.,;:!?]+$/g,'').trim();}

var soundOn=true,AC=null;
function ctx(){if(!AC){try{var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}catch(e){}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}return AC;}
function tone(f,t0,dur,type,vol){var a=ctx();if(!a)return;
  var o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
  var t=a.currentTime+t0;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05);}
function playOk(){if(!soundOn)return;try{tone(988,0,.16,'sine',.22);tone(1319,.14,.28,'sine',.22);}catch(e){}}
function playNo(){if(!soundOn)return;try{tone(233,0,.22,'sine',.14);tone(196,.16,.3,'sine',.12);}catch(e){}}
$('snd').addEventListener('click',function(){soundOn=!soundOn;this.textContent=soundOn?'🔊':'🔇';this.setAttribute('aria-label',soundOn?'Tắt âm thanh':'Bật âm thanh');if(soundOn){ctx();playOk();}});

var ITEMS=[],OPENS=[],graded=false,warned=false,okN=0,noN=0;
var PRAISE=['Đúng rồi! 🎉','Giỏi quá! ⭐','Chính xác! 👏','Tuyệt vời! 🌟','Hay lắm! 💯'];
var SORRY=['Chưa đúng, cố lên nhé!','Gần rồi, lần sau sẽ đúng!','Chưa chính xác, em xem đáp án nhé.'];
function burst(card){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var s=el('div','stars');s.setAttribute('aria-hidden','true');
  for(var i=0;i<7;i++){var st=el('i',null,'⭐');var ang=(i/7)*Math.PI*2;st.style.setProperty('--dx',Math.round(Math.cos(ang)*70)+'px');st.style.setProperty('--dy',Math.round(Math.sin(ang)*50-20)+'px');s.appendChild(st);}
  card.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},1000);
}
function partLabel(q,p,multi){return p.lab?p.lab:'Câu '+q.num+(multi?p.k:'');}
function updProg(){
  var total=ITEMS.length,done=ITEMS.filter(function(i){return i.done;}).length;
  $('progBar').style.width=(total?Math.round(done*100/total):0)+'%';
  $('progTxt').textContent='Đã chấm '+done+'/'+total+' câu';
}
function setTag(it,tagEl){
  tagEl.textContent=fmt(it.earned)+'/'+fmt(it.max)+' điểm';
  tagEl.className='score-tag show '+(it.earned>=it.max?'full':(it.earned<=0?'zero':'part'));
}
function showFb(box,ok,head,lines,why){
  box.className='fb show '+(ok?'ok':'no');
  box.innerHTML='<div class="h"></div>';box.querySelector('.h').textContent=head;
  lines.forEach(function(l){var p=el('p');p.textContent=l;box.appendChild(p);});
  if(why){var w=el('p','why');w.textContent='💡 '+why;box.appendChild(w);}
}

function buildMC(q,p,multi,wrap,card){
  var lab=partLabel(q,p,multi);
  var it={label:lab,max:p.pts,earned:0,done:false};
  var tag=q._tag;
  if(multi){
    var head=el('div','q-head');head.appendChild(el('span','qlab sm',lab));
    if(p.q){var t=el('span','t');t.innerHTML=p.q;head.appendChild(t);}
    head.appendChild(el('span','pts',fmt(p.pts)+' điểm'));tag=el('span','score-tag');head.appendChild(tag);
    wrap.appendChild(head);
  }
  if(p.pre){wrap.insertAdjacentHTML('beforeend',p.pre);}
  var opts=el('div','opts'+(p.inline?' inline':''));wrap.appendChild(opts);
  var fb=el('div','fb');fb.setAttribute('role','status');fb.setAttribute('aria-live','polite');wrap.appendChild(fb);
  var btns=[];
  function finish(pick,forced){
    if(it.done)return;it.done=true;it.pick=pick;
    var ok=(pick===p.a);it.earned=ok?p.pts:0;
    wrap.classList.add('locked');
    btns.forEach(function(b,j){b.disabled=false;b.setAttribute('aria-disabled','true');
      if(j===p.a)b.classList.add('right');else if(j===pick)b.classList.add('wrong');});
    var right='Đáp án đúng: '+'ABCD'[p.a]+'. '+p.opts[p.a];
    if(ok){showFb(fb,true,PRAISE[okN++%PRAISE.length],[],p.why);}
    else if(pick==null){showFb(fb,false,'Em chưa chọn đáp án.',[right],p.why);}
    else{showFb(fb,false,SORRY[noN++%SORRY.length],[right],p.why);}
    setTag(it,tag);updProg();
    if(!forced){if(ok){playOk();burst(card);}else playNo();}
  }
  p.opts.forEach(function(t,j){
    var b=el('button','opt','<b>'+'ABCD'[j]+'</b><span></span>');b.type='button';b.querySelector('span').textContent=t;
    b.addEventListener('click',function(){finish(j,false);});
    opts.appendChild(b);btns.push(b);
  });
  it.force=function(){finish(null,true);};
  it.reset=function(){it.done=false;it.earned=0;it.pick=null;wrap.classList.remove('locked');
    btns.forEach(function(b){b.classList.remove('right','wrong');b.removeAttribute('aria-disabled');});
    fb.className='fb';fb.innerHTML='';tag.className='score-tag';tag.textContent='';};
  ITEMS.push(it);
}

function buildFill(q,p,multi,wrap,card){
  var lab=partLabel(q,p,multi);
  var max=p.fields.reduce(function(s,f){return s+f.pts;},0);
  var it={label:lab,max:max,earned:0,done:false};
  var tag=q._tag;
  if(multi){
    var head=el('div','q-head');head.appendChild(el('span','qlab sm',lab));
    if(p.q){var t=el('span','t');t.innerHTML=p.q;head.appendChild(t);}
    head.appendChild(el('span','pts',fmt(max)+' điểm'));tag=el('span','score-tag');head.appendChild(tag);
    wrap.appendChild(head);
  }
  if(p.pre)wrap.insertAdjacentHTML('beforeend',p.pre);
  var rows=[],inputs=[];
  p.fields.forEach(function(f,i){
    var r=el('div','ff','<span class="lb"></span><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="fix"></span>');
    r.querySelector('.lb').textContent=f.lb;var inp=r.querySelector('input');inp.setAttribute('aria-label',lab+' – '+f.lb);
    inp.addEventListener('input',upd);wrap.appendChild(r);rows.push(r);inputs.push(inp);
  });
  var btn=el('button','btn sm','Kiểm tra câu này');btn.type='button';btn.disabled=true;wrap.appendChild(btn);
  var fb=el('div','fb');fb.setAttribute('role','status');fb.setAttribute('aria-live','polite');wrap.appendChild(fb);
  function upd(){btn.disabled=it.done||!inputs.some(function(x){return x.value.trim();});}
  function finish(forced){
    if(it.done)return;it.done=true;btn.disabled=true;
    var used=[],e=0,good=0;
    p.fields.forEach(function(f,i){
      var v=norm(inputs[i].value),ok=!!v&&f.ok.indexOf(v)>=0&&used.indexOf(v)<0;
      if(ok){used.push(v);e+=f.pts;good++;}
      rows[i].classList.add(ok?'right':'wrong');inputs[i].disabled=true;
      rows[i].querySelector('.fix').textContent='Đáp án đúng: '+f.show;
    });
    it.earned=e;setTag(it,tag);updProg();
    if(good===p.fields.length){showFb(fb,true,PRAISE[okN++%PRAISE.length],[],p.why);if(!forced){playOk();burst(card);}}
    else if(good>0){showFb(fb,false,'Gần đúng! Em đúng '+good+'/'+p.fields.length+' ý.',['Xem đáp án ở các ô đỏ nhé.'],p.why);if(!forced)playNo();}
    else{showFb(fb,false,SORRY[noN++%SORRY.length],['Xem đáp án ở các ô bên trên nhé.'],p.why);if(!forced)playNo();}
  }
  btn.addEventListener('click',function(){finish(false);});
  it.force=function(){finish(true);};
  it.reset=function(){it.done=false;it.earned=0;inputs.forEach(function(x){x.value='';x.disabled=false;});
    rows.forEach(function(r){r.classList.remove('right','wrong');});btn.disabled=true;fb.className='fb';fb.innerHTML='';tag.className='score-tag';tag.textContent='';};
  ITEMS.push(it);
}

function buildOpen(q,p,multi,wrap){
  var lab=partLabel(q,p,multi);
  if(multi){
    var head=el('div','q-head');head.appendChild(el('span','qlab sm',lab));
    if(p.q){var t=el('span','t');t.innerHTML=p.q;head.appendChild(t);}
    wrap.appendChild(head);
  }
  if(p.pre)wrap.insertAdjacentHTML('beforeend',p.pre);
  var ta=el('textarea',p.tall?'tall':'');ta.placeholder='Em viết câu trả lời của mình vào đây...';ta.setAttribute('aria-label',lab);
  wrap.appendChild(ta);
  wrap.appendChild(el('p','note','✏️ Phần này em tự viết, máy không chấm. Cô sẽ chấm và nhận xét sau.'));
  if(p.sugg){wrap.appendChild(el('div','sugg','<b>Gợi ý để em đối chiếu:</b> '+p.sugg));}
  OPENS.push({label:lab,ta:ta});
}

function build(){
  var root=$('content');
  CFG.sections.forEach(function(s){
    var h=el('div','section-h',ICONS[s.icon]+'<div><h2></h2><p></p></div>');
    h.querySelector('h2').textContent=s.title;h.querySelector('p').textContent=s.sub||'';root.appendChild(h);
    s.blocks.forEach(function(b){
      if(b.t==='passage'){
        var c=el('div','card');var ps=el('div','passage');
        ps.innerHTML='<h3></h3>'+b.paras.map(function(x){return '<p>'+x+'</p>';}).join('')+(b.src?'<p class="src">'+b.src+'</p>':'');
        ps.querySelector('h3').textContent=b.title;c.appendChild(ps);root.appendChild(c);return;
      }
      var q=b;var card=el('div','card q');card.id='q'+q.num;
      var multi=q.parts.length>1;
      var hd=el('div','q-head');hd.appendChild(el('span','qlab',q.qlab||('Câu '+q.num)));
      if(q.q){var tt=el('span','t');tt.innerHTML=q.q;hd.appendChild(tt);}
      if(!multi&&q.parts[0].type!=='open'){
        var pp=q.parts[0];var pts=pp.type==='fill'?pp.fields.reduce(function(a,f){return a+f.pts;},0):pp.pts;
        hd.appendChild(el('span','pts',fmt(pts)+' điểm'));q._tag=el('span','score-tag');hd.appendChild(q._tag);
      }
      card.appendChild(hd);
      if(q.hint)card.appendChild(el('p','hint',q.hint));
      if(q.pre)card.insertAdjacentHTML('beforeend',q.pre);
      q.parts.forEach(function(p){
        var w=el('div','part');card.appendChild(w);
        if(p.type==='mc'){buildMC(q,multi?p:Object.assign({},p,{q:null}),multi,w,card);}
        else if(p.type==='fill'){buildFill(q,multi?p:Object.assign({},p,{q:null}),multi,w,card);}
        else buildOpen(q,multi?p:Object.assign({},p,{q:null}),multi,w);
      });
      root.appendChild(card);
    });
  });
}

        clearTimeout(to);
        if(d&&d.ok&&d.names&&d.names.length){
          var sel=el('select');sel.id='rosterSel';sel.setAttribute('aria-label','Chọn tên của em');
          sel.innerHTML='<option value="">— Chọn tên của em —</option>';
          d.names.forEach(function(n){var o=el('option');o.value=n;o.textContent=n;sel.appendChild(o);});
          var oo=el('option');oo.value='__other';oo.textContent='Tên con không có trong danh sách';sel.appendChild(oo);
          sel.addEventListener('change',function(){$('otherWrap').style.display=(sel.value==='__other')?'block':'none';});
          $('nameBox').innerHTML='';$('nameBox').appendChild(sel);rosterSel=sel;
        }
      }).catch(function(){clearTimeout(to);});
  }catch(e){}
}

/* ---------- nộp bài ---------- */
function countBlank(){
  var n=ITEMS.filter(function(i){return !i.done;}).length;return n;
}
var lastPayload=null;
function send(){
  $('sendInfo').textContent='Đang gửi điểm cho cô...';$('resendBtn').style.display='none';
  try{
    fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(lastPayload)})
      .then(function(){$('sendInfo').textContent='✅ Bài làm đã được gửi cho cô.';})
      .catch(function(){$('sendInfo').textContent='⚠️ Chưa gửi được điểm (có thể do mạng yếu). Em bấm “Gửi lại điểm” nhé.';$('resendBtn').style.display='inline-block';});
  }catch(e){$('sendInfo').textContent='⚠️ Chưa gửi được điểm. Em bấm “Gửi lại điểm” nhé.';$('resendBtn').style.display='inline-block';}
}
$('resendBtn').addEventListener('click',send);
function lock(on){document.querySelectorAll('textarea,#studentName,#otherName,#rosterSel').forEach(function(x){x.disabled=on;});
  if(!LOP_LINK)$('studentClass').disabled=on;}
$('submitBtn').addEventListener('click',function(){
  if(graded)return;
  var msg=$('msg'),cl=$('studentClass'),name=curName();
  var nmEl=rosterSel?(rosterSel.value==='__other'?$('otherName'):rosterSel):$('studentName');
  if(!name||!cl.value.trim()){
    msg.textContent='Em hãy điền họ tên và lớp trước khi nộp bài nhé!';
    nmEl.style.borderColor=name?'':'#d94b4b';cl.style.borderColor=cl.value.trim()?'':'#d94b4b';
    (name?cl:nmEl).focus();return;
  }
  nmEl.style.borderColor='';cl.style.borderColor='';
  var blank=countBlank();
  if(blank>0&&!warned){warned=true;msg.textContent='Em còn '+blank+' câu chưa làm. Em kiểm tra lại nhé – nếu vẫn muốn nộp, hãy bấm “Nộp bài” lần nữa (câu bỏ trống tính là sai).';return;}
  msg.textContent='';graded=true;
  ITEMS.forEach(function(i){if(!i.done)i.force();});
  document.body.classList.add('graded');lock(true);$('submitBtn').disabled=true;
  var earned=0,total=0,wrong=[];
  ITEMS.forEach(function(i){earned+=i.earned;total+=i.max;if(i.earned<i.max)wrong.push(i.label);});
  var tl=OPENS.filter(function(o){return o.ta.value.trim();}).map(function(o){return o.label+': '+o.ta.value.trim();}).join('\n\n');
  lastPayload={bai:BAI,hoten:name,lop:cl.value.trim(),loplink:LOP_LINK,diem:earned,tongdiem:total,causai:wrong.join(', '),tuluan:tl};
  send();
  var pct=total?earned/total:0,em,m;
  if(pct>=.9){em='🌟';m='Tuyệt vời! Em làm bài rất xuất sắc!';}
  else if(pct>=.7){em='😊';m='Rất tốt! Em xem lại các ô đỏ để giỏi hơn nữa nhé.';}
  else if(pct>=.5){em='🙂';m='Khá lắm! Em đọc lại bài và các đáp án đúng nhé.';}
  else{em='🌱';m='Đừng lo, em đọc lại bài rồi thử lại, em sẽ làm tốt hơn!';}
  $('rEm').textContent=em;$('rSc').textContent=fmt(earned)+' / '+fmt(total)+' điểm';
  $('r10').textContent='Quy ra thang 10: '+fmt(Math.round(pct*10*4)/4)+' điểm (phần máy chấm)';
  $('rMsg').textContent=name+' ơi, '+m;
  $('rTab').innerHTML=ITEMS.map(function(i){return '<tr><td>'+i.label+'</td><td>'+fmt(i.earned)+' / '+fmt(i.max)+'</td></tr>';}).join('');
  $('result').classList.add('show');$('result').scrollIntoView({behavior:'smooth',block:'center'});
});
$('retryBtn').addEventListener('click',function(){
  graded=false;warned=false;okN=0;noN=0;lock(false);$('submitBtn').disabled=false;$('msg').textContent='';
  document.body.classList.remove('graded');
  ITEMS.forEach(function(i){i.reset();});
  OPENS.forEach(function(o){o.ta.value='';});
  $('result').classList.remove('show');lastPayload=null;updProg();window.scrollTo({top:0,behavior:'smooth'});
});
})();
</script>
