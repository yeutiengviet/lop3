<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tôi đi học — Tiếng Việt Lớp 3 - Tuần 7</title>
<style>
:root{--bg1:#fff4dc;--bg2:#ffe9c7;--orange:#f08a24;--orange-deep:#d9640b;--red:#e2533b;--green:#3d9a62;--ink:#3b2a1a;--soft:#7a6450;--paper:#fffdf8;--line:#f1dfc2;}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#ffe6b8 0%,var(--bg1) 35%,#fdf6e6 100%);min-height:100vh;padding-bottom:70px;line-height:1.5;overflow-x:hidden;}
#leaves{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.leaf{position:absolute;top:-40px;font-size:22px;opacity:.75;animation:fall linear infinite;}
@keyframes fall{0%{transform:translate(0,-40px) rotate(0deg);}50%{transform:translate(40px,50vh) rotate(180deg);}100%{transform:translate(-20px,108vh) rotate(360deg);}}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 14px;}
.hero{text-align:center;padding:26px 10px 12px;}
.badge{display:inline-block;background:#fff;border:2px dashed var(--orange);color:var(--orange-deep);font-weight:700;font-size:14px;padding:5px 16px;border-radius:999px;}
.hero h1{margin:12px 0 4px;font-size:34px;color:var(--red);letter-spacing:1px;text-shadow:2px 2px 0 #fff;}
.hero p{margin:0;color:var(--soft);font-weight:600;}
.hub{display:inline-block;margin-top:10px;font-size:14px;color:var(--orange-deep);font-weight:700;text-decoration:none;}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px 16px;margin:16px 0;box-shadow:0 8px 20px rgba(120,70,10,.08);}
.card h2{margin:0 0 10px;font-size:20px;color:var(--orange-deep);}
.info-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;}
label.fl{display:block;font-weight:700;font-size:15px;margin-bottom:5px;}
label.fl span{color:var(--red);}
input[type=text]{width:100%;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-family:inherit;}
input[type=text]:focus{outline:none;border-color:var(--orange);}
input.err{border-color:var(--red)!important;background:#fff1ee;}
.reading img{display:block;width:100%;height:auto;border-radius:14px;border:2px solid var(--line);}
.part-title{margin:26px 0 4px;font-size:19px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--orange),var(--red));padding:10px 16px;border-radius:14px;}
.q{transition:border-color .2s;scroll-margin-top:70px;}
.q.done{border-color:#f5c98a;}
.q.right{border-color:var(--green);background:#f3fbf5;}
.q.wrong{border-color:var(--red);background:#fff6f4;}
.q.miss{border-color:var(--red);animation:shake .4s;}
@keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.qnum{display:inline-block;background:var(--orange);color:#fff;font-weight:800;border-radius:10px;padding:2px 11px;font-size:14px;margin-bottom:6px;}
.qtext{font-size:17px;font-weight:700;margin:0 0 12px;}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;font-family:inherit;font-size:16px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:9px;cursor:pointer;transition:transform .1s,border-color .15s,background .15s;-webkit-tap-highlight-color:transparent;}
.opt:active{transform:scale(.98);}
.opt .let{flex:0 0 30px;height:30px;border-radius:50%;background:#fdebd0;color:var(--orange-deep);font-weight:800;display:flex;align-items:center;justify-content:center;}
.opt .tx{flex:1;padding-top:3px;}
.opt.picked{border-color:var(--orange);background:#fff3df;}
.opt.picked .let{background:var(--orange);color:#fff;}
.opt.ok{border-color:var(--green);background:#e4f6ea;}
.opt.ok .let{background:var(--green);color:#fff;}
.opt.bad{border-color:var(--red);background:#fde5e0;}
.opt.bad .let{background:var(--red);color:#fff;}
.locked .opt{cursor:default;}
.note{font-size:14px;font-weight:700;margin-top:10px;display:none;}
.q.right .note{display:block;color:var(--green);}
.q.wrong .note{display:block;color:var(--red);}
.bar{position:sticky;top:0;z-index:5;background:rgba(255,244,220,.95);padding:8px 14px;border-bottom:2px solid var(--line);}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--soft);}
.track{flex:1;height:10px;background:#f3dfbd;border-radius:99px;overflow:hidden;}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--red));border-radius:99px;transition:width .3s;}
.btn{display:block;width:100%;font-family:inherit;font-size:19px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--orange),var(--red));border:none;border-radius:16px;padding:15px;cursor:pointer;box-shadow:0 6px 0 #b8480a;margin-top:8px;}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b8480a;}
.btn:disabled{opacity:.6;cursor:default;}
.btn.sec{background:#fff;color:var(--orange-deep);border:2px solid var(--orange);box-shadow:none;font-size:16px;padding:11px;margin-top:14px;}
.warn{color:var(--red);font-weight:700;text-align:center;min-height:22px;margin:8px 0 0;}
#result{display:none;text-align:center;scroll-margin-top:70px;}
#result .emo{font-size:54px;line-height:1;}
#result .score{font-size:36px;font-weight:800;color:var(--red);margin:6px 0;}
#result .msg{font-size:17px;font-weight:600;}
#result .sent{font-size:14px;color:var(--soft);margin-top:8px;}
.pop{position:fixed;top:-30px;font-size:26px;z-index:20;pointer-events:none;animation:popfall 2.6s ease-in forwards;}
@keyframes popfall{to{transform:translateY(110vh) rotate(540deg);opacity:.2;}}
@media (max-width:520px){.info-grid{grid-template-columns:1fr;}.hero h1{font-size:28px;}.qtext{font-size:16px;}}
@media (prefers-reduced-motion:reduce){.leaf,.pop{animation:none;display:none;}}
</style>
</head>

      s.className = "leaf"; s.textContent = icons[i%3];
      s.style.left = (Math.random()*100) + "%";
      s.style.fontSize = (16+Math.random()*14) + "px";
      s.style.animationDuration = (9+Math.random()*10) + "s";
      s.style.animationDelay = (-Math.random()*15) + "s";
      box.appendChild(s);
    }
  })();

  function build(){
    quiz.innerHTML = ""; answers = [];
    var lastPart = 0;
    QUESTIONS.forEach(function(item, i){
      answers.push(-1);
      if(item.part !== lastPart){
        var t = document.createElement("div");
        t.className = "part-title"; t.textContent = PARTS[item.part];
        quiz.appendChild(t); lastPart = item.part;
      }
      var card = document.createElement("div");
      card.className = "card q"; card.id = "q" + i;
      var h = '<span class="qnum">Câu ' + (i+1) + '</span><p class="qtext">' + item.q + '</p>';
      item.o.forEach(function(txt, j){
        h += '<button type="button" class="opt" data-q="' + i + '" data-o="' + j + '"><span class="let">' + LETTERS[j] + '</span><span class="tx">' + txt + '</span></button>';
      });
      h += '<div class="note"></div>';
      card.innerHTML = h;
      quiz.appendChild(card);
    });
    updateProgress();
  }

  function updateProgress(){
    var n = answers.filter(function(a){return a >= 0;}).length;
    document.getElementById("progText").textContent = n + "/" + QUESTIONS.length + " câu";
    document.getElementById("progFill").style.width = (n/QUESTIONS.length*100) + "%";
  }

  quiz.addEventListener("click", function(e){
    if(submitted) return;
    var btn = e.target.closest ? e.target.closest(".opt") : null;
    if(!btn) return;
    var qi = +btn.getAttribute("data-q"), oi = +btn.getAttribute("data-o");
    answers[qi] = oi;
    var card = document.getElementById("q" + qi);
    card.querySelectorAll(".opt").forEach(function(o){ o.classList.remove("picked"); });
    btn.classList.add("picked");
    card.classList.add("done"); card.classList.remove("miss");
    warn.textContent = "";
    updateProgress();
  });

  [nameInput, classInput].forEach(function(inp){
    inp.addEventListener("input", function(){ inp.classList.remove("err"); });
  });

  function celebrate(){
    var icons = ["🍁","🍂","⭐","🌟","🎉"];
    for(var i=0;i<26;i++){
      (function(k){
        var s = document.createElement("span");
        s.className = "pop"; s.textContent = icons[k % icons.length];
        s.style.left = (Math.random()*100) + "%";
        s.style.animationDelay = (Math.random()*0.8) + "s";
        document.body.appendChild(s);
        setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 3600);
      })(i);
    }
  }

  document.getElementById("submitBtn").addEventListener("click", function(){
    if(submitted) return;
    var name = nameInput.value.trim(), lop = classInput.value.trim();
    if(!name){ nameInput.classList.add("err"); warn.textContent = "Em hãy điền họ và tên nhé!"; nameInput.scrollIntoView({block:"center"}); nameInput.focus(); return; }
    if(!lop){ classInput.classList.add("err"); warn.textContent = "Em hãy điền lớp của mình nhé!"; classInput.scrollIntoView({block:"center"}); classInput.focus(); return; }
    var missing = answers.indexOf(-1);
    if(missing >= 0){
      var left = answers.filter(function(a){return a < 0;}).length;
      warn.textContent = "Em còn " + left + " câu chưa làm. Hãy hoàn thành rồi nộp bài nhé!";
      var mc = document.getElementById("q" + missing);
      mc.classList.remove("miss"); void mc.offsetWidth; mc.classList.add("miss");
      mc.scrollIntoView({block:"center"});
      return;
    }
    submitted = true;
    warn.textContent = "";
    this.disabled = true;
    quiz.classList.add("locked");

    var earned = 0, possible = QUESTIONS.length;
    QUESTIONS.forEach(function(item, i){
      var card = document.getElementById("q" + i);
      var opts = card.querySelectorAll(".opt");
      var ok = answers[i] === item.a;
      if(ok) earned++;
      opts[item.a].classList.add("ok");
      if(!ok) opts[answers[i]].classList.add("bad");
      card.classList.remove("done");
      card.classList.add(ok ? "right" : "wrong");
      card.querySelector(".note").textContent = ok ? "✅ Chính xác!" : "❌ Chưa đúng. Đáp án đúng là " + LETTERS[item.a] + ".";
    });

    /* Gửi kết quả về Google Sheet của giáo viên */
    try {
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {"Content-Type": "text/plain;charset=utf-8"},
        body: JSON.stringify({ bai: BAI, hoten: name, lop: lop, diem: earned, tongdiem: possible })
      }).catch(function(){});
    } catch(e) {}

    var pct = earned / possible * 100, emo, msg;
    if(pct >= 90){ emo = "🌟"; msg = "Tuyệt vời! Em đọc hiểu rất tốt!"; }
    else if(pct >= 70){ emo = "🍁"; msg = "Rất tốt! Em cố thêm một chút nữa nhé."; }
    else if(pct >= 50){ emo = "🍂"; msg = "Khá lắm! Em xem lại các câu sai để nhớ lâu hơn nhé."; }
    else { emo = "💪"; msg = "Đừng lo, em hãy đọc lại bài và thử lần nữa nhé!"; }
    document.getElementById("rEmo").textContent = emo;
    document.getElementById("rScore").textContent = earned + " / " + possible + " điểm";
    document.getElementById("rMsg").textContent = name + " ơi, " + msg;
    var r = document.getElementById("result");
    r.style.display = "block";
    r.scrollIntoView({block:"center"});
    if(pct >= 70) celebrate();
  });

  document.getElementById("retryBtn").addEventListener("click", function(){
    submitted = false;
    quiz.classList.remove("locked");
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("result").style.display = "none";
    build();
    window.scrollTo(0, 0);
  });

  build();
})();
</script>
</body>
</html>
