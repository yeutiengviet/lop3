<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khu vườn trên sân thượng — Tiếng Việt Lớp 3 - Tuần 6</title>
<style>
:root{--leaf:#3fa56b;--leaf-d:#2b7d4f;--leaf-l:#e6f6ea;--sun:#ffc93c;--red:#e8523f;--ink:#263238;--soft:#5d6b70;--line:#dbe9df;--paper:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);font-size:17px;line-height:1.5;
background:linear-gradient(180deg,#dff3ff 0,#f2fbf3 320px,#f7fcf4 100%);min-height:100vh;padding-bottom:70px;overflow-x:hidden}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.hero{text-align:center;padding:26px 14px 10px;position:relative}
.sunny{font-size:46px;display:inline-block;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-block;background:#fff;border:2px dashed var(--leaf);color:var(--leaf-d);font-weight:700;font-size:14px;padding:5px 14px;border-radius:999px}
h1{margin:10px 0 4px;font-size:30px;line-height:1.2;color:var(--red);letter-spacing:.3px}
.sub{color:var(--soft);margin:0 0 6px}
.pots{font-size:28px;letter-spacing:6px}
.pots span{display:inline-block;animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
.pots span:nth-child(2n){animation-delay:.6s}.pots span:nth-child(3n){animation-delay:1.2s}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px 16px;margin:16px 0;box-shadow:0 6px 18px rgba(43,125,79,.08)}
.card h2{margin:0 0 10px;font-size:20px;color:var(--leaf-d)}
.info label{display:block;font-weight:700;margin:10px 0 5px}
.info input{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;outline:none;background:#fbfffb}
.info input:focus{border-color:var(--leaf)}
.info input.err{border-color:var(--red);background:#fff5f3}
.req{color:var(--red)}
.story img{display:block;width:100%;height:auto;border-radius:14px;border:2px solid var(--line)}
.progress{position:sticky;top:0;z-index:5;background:rgba(242,251,243,.96);padding:8px 0;backdrop-filter:blur(4px)}
.pbar{height:14px;background:#fff;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.pfill{height:100%;width:0;background:linear-gradient(90deg,#9be0a8,var(--leaf));transition:width .4s}
.ptxt{font-size:14px;color:var(--soft);font-weight:700;margin-top:4px;text-align:center}
.q .num{display:inline-block;background:var(--leaf);color:#fff;font-weight:700;border-radius:999px;padding:3px 12px;font-size:14px;margin-bottom:8px}
.q .multi{display:inline-block;margin-left:6px;background:#fff4d1;color:#8a6100;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px}
.q .qt{font-weight:700;margin:0 0 10px;font-size:18px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 12px;margin:8px 0;border:2px solid var(--line);border-radius:14px;cursor:pointer;background:#fcfffc;transition:transform .12s,border-color .12s,background .12s}
.opt:active{transform:scale(.98)}
.opt input{width:22px;height:22px;margin:2px 0 0;flex:0 0 22px;accent-color:var(--leaf)}
.opt.picked{border-color:var(--leaf);background:var(--leaf-l)}
.q.miss{border-color:var(--red)}
.done .opt{cursor:default}
.done .opt.right{border-color:var(--leaf);background:#dff5e5}
.done .opt.right::after{content:"✔";color:var(--leaf-d);font-weight:700;margin-left:auto}
.done .opt.wrong{border-color:var(--red);background:#ffece9}
.done .opt.wrong::after{content:"✘";color:var(--red);font-weight:700;margin-left:auto}
.fb{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;font-size:16px}
.done .fb{display:block}
.fb.ok{background:#e6f6ea;color:#1f5e3b}.fb.no{background:#fff1ee;color:#8f2c1f}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:19px;color:#fff;background:var(--leaf);border:0;border-radius:16px;padding:15px;cursor:pointer;box-shadow:0 5px 0 var(--leaf-d)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--leaf-d)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.alt{background:#fff;color:var(--leaf-d);border:2px solid var(--leaf);box-shadow:none;margin-top:12px}
.warn{display:none;color:var(--red);font-weight:700;text-align:center;margin:0 0 10px}
#result{display:none;text-align:center;border-color:var(--sun);background:#fffdf3}
#result .em{font-size:60px;line-height:1.1;animation:pop .6s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
#result .sc{font-size:34px;font-weight:800;color:var(--leaf-d);margin:4px 0}
#result .st{font-size:14px;color:var(--soft);margin-top:8px}
.leaf{position:fixed;top:-40px;font-size:26px;pointer-events:none;z-index:20;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.7}}
@media (max-width:480px){body{font-size:16px}h1{font-size:25px}.card{padding:15px 12px}.q .qt{font-size:17px}}
@media (prefers-reduced-motion:reduce){.sunny,.pots span{animation:none}}
</style>
</head>
<body>
<div class="hero">
  <div class="sunny">🌞</div><br>
  <span class="badge">Tiếng Việt Lớp 3 · Tuần 6</span>
  <h1>KHU VƯỜN TRÊN SÂN THƯỢNG</h1>
  <p class="sub">Đọc bài thật kĩ rồi trả lời 10 câu hỏi nhé!</p>
  <div class="pots"><span>🌱</span><span>🪴</span><span>🌿</span><span>🍅</span><span>🌼</span><span>🪴</span><span>🌱</span></div>
</div>

var QUESTIONS = [{"t": "Bố và Bon dùng chai nhựa thu gom được để làm gì?", "o": ["A. Để bán ve chai.", "B. Để làm chậu trồng cây, bình tưới cây.", "C. Để trang trí sân thượng.", "D. Để đựng nước uống."], "a": [1], "e": "Hai bố con làm chai nhựa thành những chậu cây nhỏ, bố còn dùng chai nhựa làm bình tưới."}, {"t": "Bon làm những việc gì để cùng bố chăm sóc khu vườn trên sân thượng?", "m": 1, "o": ["Tưới cây", "Nhổ cỏ", "Bắt sâu", "Hái rau"], "a": [1, 2], "e": "Trong bài, Bon chăm chú nhổ cỏ dại và bắt sâu xanh. Bố là người tưới cây, mẹ là người hái rau."}, {"t": "Từ ngữ nào miêu tả cảm xúc của Bon khi hai bố con cùng xây dựng một khu vườn trên sân thượng?", "o": ["A. Ngạc nhiên", "B. Hào hứng", "C. Vui vẻ", "D. Kinh hãi"], "a": [1], "e": "Bài đọc viết: “Bon hào hứng nói với bố.”"}, {"t": "Câu nào là câu khiến trong các câu sau?", "m": 1, "o": ["A. Một khu vườn trên sân thượng, tuyệt vời quá bố ạ!", "B. Bây giờ thì mẹ mở mắt ra đi!", "C. Mình phải tái sử dụng những chai nhựa này để tưới cây, vừa để bảo vệ môi trường, vừa tiết kiệm đó con!", "D. Khu vườn này bố và con dành tặng mẹ đấy!"], "a": [1], "e": "Câu B dùng để đề nghị mẹ làm một việc (mở mắt ra), có từ “đi” ở cuối câu. Câu A là câu cảm; câu C và D dùng để giải thích, kể."}, {"t": "Câu nào dưới đây là <b>câu nêu hoạt động</b>?", "o": ["A. Bon là một cậu bé ngoan.", "B. Bon theo bố lên sân thượng chăm sóc khu vườn.", "C. Khu vườn trên sân thượng thật xanh tốt.", "D. Bố là người yêu thiên nhiên."], "a": [1], "e": "Câu B có các từ chỉ hoạt động: theo, lên, chăm sóc."}, {"t": "Câu <i>“Mẹ thường lên sân thượng hái rau sạch để nấu ăn cho cả nhà.”</i> thuộc kiểu câu nào?", "o": ["A. Câu giới thiệu", "B. Câu nêu đặc điểm", "C. Câu nêu hoạt động", "D. Câu hỏi"], "a": [2], "e": "Câu kể về việc mẹ làm: lên sân thượng, hái rau, nấu ăn."}, {"t": "Câu nào dưới đây là <b>câu giới thiệu</b>?", "o": ["A. Bon chăm chú nhổ cỏ dại.", "B. Bố dùng chai nhựa làm bình tưới.", "C. Bon là cậu bé rất yêu thiên nhiên.", "D. Khu vườn rất xanh tốt."], "a": [2], "e": "Câu giới thiệu thường có từ “là”: Bon <b>là</b> cậu bé rất yêu thiên nhiên."}, {"t": "Câu nào dưới đây là <b>câu nêu đặc điểm</b>?", "o": ["A. Bố và Bon cùng trồng cây.", "B. Mẹ lên sân thượng hái rau.", "C. Khu vườn trên sân thượng rất đẹp.", "D. Bon là con của bố mẹ."], "a": [2], "e": "Câu C có từ chỉ đặc điểm: (rất) đẹp."}, {"t": "Câu nào dưới đây là <b>câu cảm</b>?", "o": ["A. Bon theo bố lên sân thượng.", "B. Bố đang tưới cây phải không ạ?", "C. Một khu vườn trên sân thượng, tuyệt vời quá bố ạ!", "D. Bon hãy giúp bố tưới cây nhé!"], "a": [2], "e": "Câu C bộc lộ cảm xúc thích thú, có từ “quá” và dấu chấm than."}, {"t": "Câu nào dưới đây là <b>câu hỏi</b>?", "o": ["A. Bố ơi, những chiếc chai nhựa này dùng để làm gì ạ?", "B. Bố hãy cho con tưới cây với ạ!", "C. Khu vườn đẹp quá!", "D. Bon cùng bố chăm sóc khu vườn."], "a": [0], "e": "Câu A dùng để hỏi, có từ “gì” và dấu chấm hỏi ở cuối câu."}];

/* Chấm 1 câu: đúng khi chọn đủ và chỉ chọn các đáp án đúng */
function isRight(q, picked){
  if(picked.length !== q.a.length) return false;
  var s = picked.slice().sort(), a = q.a.slice().sort();
  for(var i=0;i<a.length;i++){ if(s[i] !== a[i]) return false; }
  return true;
}
function grade(allPicked){
  var earned = 0;
  for(var i=0;i<QUESTIONS.length;i++){ if(isRight(QUESTIONS[i], allPicked[i] || [])) earned++; }
  return earned;
}

(function(){
  if(typeof document === 'undefined') return;
  var quiz = document.getElementById('quiz');
  var nameInput = document.getElementById('studentName');
  var classInput = document.getElementById('studentClass');
  var submitBtn = document.getElementById('submitBtn');
  var warn = document.getElementById('warn');
  var submitted = false;

  var h = '';
  QUESTIONS.forEach(function(q, i){
    h += '<div class="card q" id="q'+i+'"><span class="num">Câu '+(i+1)+'</span>';
    if(q.m) h += '<span class="multi">Có thể chọn nhiều đáp án</span>';
    h += '<p class="qt">'+q.t+'</p>';
    q.o.forEach(function(o, j){
      h += '<label class="opt"><input type="'+(q.m?'checkbox':'radio')+'" name="q'+i+'" value="'+j+'"><span>'+o+'</span></label>';
    });
    h += '<div class="fb"></div></div>';
  });
  quiz.innerHTML = h;

  function pickedOf(i){
    var arr = [];
    document.querySelectorAll('input[name="q'+i+'"]').forEach(function(inp){ if(inp.checked) arr.push(parseInt(inp.value,10)); });
    return arr;
  }
  function refresh(){
    var n = 0;
    QUESTIONS.forEach(function(q, i){
      var has = pickedOf(i).length > 0;
      if(has){ n++; document.getElementById('q'+i).classList.remove('miss'); }
      document.querySelectorAll('#q'+i+' .opt').forEach(function(l){ l.classList.toggle('picked', l.querySelector('input').checked); });
    });
    document.getElementById('pfill').style.width = (n/QUESTIONS.length*100)+'%';
    document.getElementById('ptxt').textContent = '🌱 Em đã làm '+n+' / '+QUESTIONS.length+' câu';
  }
  quiz.addEventListener('change', refresh);
  [nameInput, classInput].forEach(function(inp){ inp.addEventListener('input', function(){ inp.classList.remove('err'); }); });

  function leaves(){
    var items = ['🍃','🌿','🌼','🍀','🌻'];
    for(var i=0;i<28;i++){
      (function(k){
        var s = document.createElement('span');
        s.className = 'leaf'; s.textContent = items[k % items.length];
        s.style.left = (Math.random()*96)+'vw';
        s.style.animationDuration = (2.5+Math.random()*2.5)+'s';
        s.style.animationDelay = (Math.random()*1.2)+'s';
        document.body.appendChild(s);
        setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 7000);
      })(i);
    }
  }

  submitBtn.addEventListener('click', function(){
    if(submitted) return;
    var hoten = nameInput.value.trim(), lop = classInput.value.trim();
    warn.style.display = 'none';
    if(!hoten || !lop){
      nameInput.classList.toggle('err', !hoten);
      classInput.classList.toggle('err', !lop);
      warn.textContent = !hoten ? 'Em hãy điền họ và tên nhé!' : 'Em hãy điền lớp của em nhé!';
      warn.style.display = 'block';
      (!hoten ? nameInput : classInput).scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    var all = [], firstMiss = null;
    QUESTIONS.forEach(function(q, i){
      var p = pickedOf(i); all.push(p);
      if(!p.length){ document.getElementById('q'+i).classList.add('miss'); if(firstMiss === null) firstMiss = i; }
    });
    if(firstMiss !== null){
      warn.textContent = 'Em còn câu chưa làm (Câu '+(firstMiss+1)+'). Hãy làm hết rồi nộp bài nhé!';
      warn.style.display = 'block';
      document.getElementById('q'+firstMiss).scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    submitted = true;
    submitBtn.disabled = true;
    var earned = grade(all), possible = QUESTIONS.length;

    QUESTIONS.forEach(function(q, i){
      var card = document.getElementById('q'+i), ok = isRight(q, all[i]);
      card.classList.add('done');
      card.querySelectorAll('.opt').forEach(function(l, j){
        var inp = l.querySelector('input'); inp.disabled = true;
        if(q.a.indexOf(j) > -1) l.classList.add('right');
        else if(inp.checked) l.classList.add('wrong');
      });
      var fb = card.querySelector('.fb');
      fb.className = 'fb ' + (ok ? 'ok' : 'no');
      fb.innerHTML = (ok ? '🎉 <b>Chính xác!</b> ' : '💡 <b>Chưa đúng.</b> ') + q.e;
    });

    var st = document.getElementById('rSt');
    st.textContent = 'Đang gửi kết quả cho cô...';
    try{
      fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({ bai: BAI, hoten: hoten, lop: lop, diem: earned, tongdiem: possible })
      }).then(function(){ st.textContent = '✅ Kết quả đã được gửi cho cô.'; })
        .catch(function(){ st.textContent = '⚠️ Chưa gửi được kết quả. Em kiểm tra mạng rồi chụp màn hình gửi cô nhé!'; });
    }catch(e){ st.textContent = '⚠️ Chưa gửi được kết quả. Em chụp màn hình gửi cô nhé!'; }

    var pct = earned/possible*100, em, msg;
    if(pct >= 90){ em = '🌻'; msg = 'Tuyệt vời! Khu vườn của em nở hoa rực rỡ!'; }
    else if(pct >= 70){ em = '🪴'; msg = 'Rất tốt! Cây của em đang lớn nhanh lắm.'; }
    else if(pct >= 50){ em = '🌱'; msg = 'Khá lắm! Xem lại vài câu sai để giỏi hơn nhé.'; }
    else { em = '💧'; msg = 'Đừng lo, em hãy đọc lại bài và thử lần nữa nhé!'; }
    document.getElementById('rEm').textContent = em;
    document.getElementById('rSc').textContent = earned+' / '+possible+' điểm';
    document.getElementById('rMsg').textContent = hoten+' ơi, '+msg;
    var r = document.getElementById('result');
    r.style.display = 'block';
    r.scrollIntoView({behavior:'smooth', block:'center'});
    if(pct >= 70) leaves();
  });

  document.getElementById('retryBtn').addEventListener('click', function(){
    submitted = false; submitBtn.disabled = false;
    document.querySelectorAll('#quiz input').forEach(function(inp){ inp.checked = false; inp.disabled = false; });
    document.querySelectorAll('.q').forEach(function(c){ c.classList.remove('done','miss'); });
    document.querySelectorAll('.opt').forEach(function(l){ l.classList.remove('right','wrong','picked'); });
    document.getElementById('result').style.display = 'none';
    warn.style.display = 'none';
    refresh();
    document.getElementById('quiz').scrollIntoView({behavior:'smooth', block:'start'});
  });

  refresh();
})();
if(typeof module !== 'undefined') module.exports = {QUESTIONS:QUESTIONS, grade:grade, isRight:isRight};
</script>
</body>
</html>
